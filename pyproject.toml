[project]
name = "ai-llm-adoption-dashboard"
version = "1.0.0"
description = "Interactive dashboard for the Global AI & LLM Tools Adoption Dataset (2026)"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
